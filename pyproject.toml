[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schemashift"
version = "1.0.0"
description = "A deterministic-first hybrid NoSQL-to-SQL migration developer tool"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=0.2.0"]
llm = ["openai>=1.40.0"]

[project.scripts]
schemashift = "schemashift.cli:main"

[tool.setuptools.packages.find]
include = ["schemashift*"]
